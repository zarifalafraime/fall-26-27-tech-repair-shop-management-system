<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header"><h1 class="logo">Admin - User Management</h1></header>
  <main class="container">
  <nav class="topnav">
    <a href="user-management.html">User Management</a> |
    <a href="activity-logs.html">Activity Logs</a> |
    <a href="analytics.html">Analytics</a>
  </nav>
  <hr>
  <h2>Manage Users</h2>
  <h3>Create User</h3>
  <p id="message" role="status"></p>
  <form class="card" id="userForm" onsubmit="return saveUser()">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <br><br>
    <label for="role">Role:</label>
    <select id="role" name="role">
      <option value="Customer">Customer</option>
      <option value="Technician">Technician</option>
      <option value="Manager">Manager</option>
      <option value="Admin">Admin</option>
    </select>
    <br><br>
    <label for="status">Status:</label>
    <select id="status" name="status">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
    <br><br>
    <button id="saveButton" type="submit">Create User</button>
  </form>
  <hr>
  <h2>User List</h2>
  <div class="table-wrapper"><table class="data-table">
    <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
    <tbody id="userRows"></tbody>
  </table></div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
