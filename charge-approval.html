  <h2>Request Additional Repair Approval</h2>
  <form>
    <label for="request-id">Request ID:</label><br>
    <input type="text" id="request-id" name="request_id"><br><br>

    <label for="additional-work">Additional Work:</label><br>
    <textarea id="additional-work" name="additional_work" rows="4" cols="40"></textarea><br><br>

    <label for="cost">Cost:</label><br>
    <input type="text" id="cost" name="cost"><br><br>

    <input type="submit" value="Submit Request">
  </form>
  <h2>Approval Requests</h2>
  <table border="1">
    <tr>
      <th>Request ID</th>
      <th>Additional Work</th>
      <th>Cost</th>
      <th>Status</th>
    </tr>
  </table>
