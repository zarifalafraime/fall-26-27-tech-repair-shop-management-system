<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repair Records | TechCare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header"><h1 class="logo">Technician - Repair Records</h1></header>
  <nav class="topnav" aria-label="Technician pages">
    <a href="assigned-repairs.html">Assigned Repairs</a>
    <a href="repair-records.html" class="active" aria-current="page">Repair Records</a>
    <a href="charge-approval.html">Charge Approval</a>
  </nav>
  <main class="container">
    <form class="card" onsubmit="return saveRecord(this)">
      <label for="job">Assigned repair</label>
      <select id="job" required></select>
      <label for="diagnosis">Diagnosis</label>
      <textarea id="diagnosis" required></textarea>
      <label for="parts">Spare parts used (optional)</label>
      <input type="text" id="parts">
      <label for="notes">Repair notes</label>
      <textarea id="notes" required></textarea>
      <button class="btn" type="submit">Save repair record</button>
    </form>
    <div class="table-wrapper"><table class="data-table">
      <thead><tr><th scope="col">Request</th><th scope="col">Diagnosis</th><th scope="col">Parts</th><th scope="col">Notes</th></tr></thead>
      <tbody id="records"></tbody>
    </table></div>
    <p id="feedback" role="status"></p>
  </main>
  <script src="js/common.js"></script>
  <script src="js/shop-data.js"></script>
  <script src="js/technician.js"></script>
</body>
</html>
