<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit Repair Request | TechCare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header"><h1 class="logo">Customer - Submit Repair Request</h1></header>
  <nav class="topnav" aria-label="Customer pages">
    <a href="submit-repair-request.html" class="active" aria-current="page">Submit Repair Request</a>
    <a href="repair-history.html">Repair History</a>
    <a href="notifications.html">Notifications</a>
  </nav>
  <main class="container">
    <form class="card" onsubmit="return submitRepair(this)">
      <label for="device">Device type</label>
      <input type="text" id="device" required>
      <label for="model">Model</label>
      <input type="text" id="model" required>
      <label for="serial">Serial number</label>
      <input type="text" id="serial" required>
      <label for="issue">Issue description</label>
      <textarea id="issue" required></textarea>
      <button class="btn" type="submit">Submit request</button>
    </form>
    <p id="feedback" role="status"></p>
  </main>
  <script src="js/common.js"></script>
  <script src="js/shop-data.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
