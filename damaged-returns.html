<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damaged and Returned Products | TechCare</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/shop-data.js"></script>
  <script defer src="js/manager.js"></script>
</head>
<body class="shop-role">
  <header class="header"><h1>Manager - Damaged and Returned Products</h1></header>
  <nav aria-label="Manager pages">
    <a href="repair-assignment.html">Repair Assignment</a>
    <a href="damaged-returns.html" aria-current="page">Damaged and Returned Products</a>
    <a href="stock-alerts.html">Stock Alerts</a>
  </nav>
  <main class="container">
    <form onsubmit="return saveReturn(this)">
      <label for="product">Product</label>
      <input id="product" required>
      <label for="kind">Record type</label>
      <select id="kind"><option>Damaged</option><option>Returned</option></select>
      <label for="quantity">Quantity</label>
      <input id="quantity" type="number" min="1" step="1" required>
      <label for="reason">Reason</label>
      <textarea id="reason" required></textarea>
      <button type="submit">Save record</button>
    </form>
    <table>
      <thead><tr><th scope="col">Product</th><th scope="col">Type</th><th scope="col">Quantity</th><th scope="col">Reason</th></tr></thead>
      <tbody id="returnRows"></tbody>
    </table>
    <p id="feedback" role="status"></p>
  </main>
</body>
</html>
